name: backfill-and-enrich

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "enrich (dates/durations + guest radar), backfill (initial), or radar only"
        type: choice
        options: [enrich, backfill, radar]
        default: enrich
  schedule:
    - cron: "0 6 1 * *" # monthly: exact dates/durations, removed flags, gap-heal

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Run ${{ inputs.mode || 'enrich' }}
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          if [ "${{ inputs.mode || 'enrich' }}" = "backfill" ]; then
            python -m pipeline.backfill_api
          elif [ "${{ inputs.mode || 'enrich' }}" = "radar" ]; then
            python -m pipeline.radar
          else
            python -m pipeline.enrich
            python -m pipeline.radar
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: API enrich + guest radar" && git push)
